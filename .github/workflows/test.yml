name: tests

on:
  push:
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install .
      - name: Self-test against MATLAB/Octave reference values
        run: python verify/selftest.py
      - name: CLI smoke test
        run: fusion-metrics --list
