<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#00d2ff"/><stop offset=".55" stop-color="#a855f7"/><stop offset="1" stop-color="#00f5a0"/></linearGradient></defs>
<rect x=".5" y=".5" width="1199" height="299" rx="14" fill="#ffffff" stroke="#d0d7de"/>
<rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#g)"/>
<text x="40" y="46" font-size="22" font-weight="700" fill="#1f2328">fusion-metrics</text>
<text x="222" y="46" font-size="14" fill="#57606a">every metric is checked against the original MATLAB code, value by value</text>
<rect x="40" y="86" width="200" height="112" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/>
<text x="140.0" y="114" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2328">Test images</text>
<text x="140.0" y="138" text-anchor="middle" font-size="12" fill="#57606a">7 synthetic edge cases</text>
<text x="140.0" y="157" text-anchor="middle" font-size="12" fill="#57606a">+ public PET/SPECT–MRI</text>
<text x="140.0" y="176" text-anchor="middle" font-size="12" fill="#57606a">pairs (Harvard atlas)</text>
<rect x="330" y="72" width="230" height="60" rx="10" fill="#fff4e5" stroke="#f0883e" stroke-width="1.4"/>
<text x="445.0" y="100" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2328">MATLAB reference .m</text>
<text x="445" y="120" text-anchor="middle" font-size="12" fill="#57606a">run in MATLAB / GNU Octave</text>
<rect x="330" y="160" width="230" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.4"/>
<text x="445.0" y="188" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2328">fusion_metrics (Python)</text>
<text x="445" y="208" text-anchor="middle" font-size="12" fill="#57606a">line-by-line port, NumPy/SciPy</text>
<line x1="244" y1="130" x2="324" y2="104" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="244" y1="152" x2="324" y2="188" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="650" y="86" width="230" height="112" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/>
<text x="765.0" y="114" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2328">Compare per value</text>
<text x="765.0" y="138" text-anchor="middle" font-size="12" fill="#57606a">|Python − MATLAB|</text>
<text x="765.0" y="157" text-anchor="middle" font-size="12" fill="#57606a">on every case and metric</text>
<text x="765.0" y="176" text-anchor="middle" font-size="12" fill="#57606a">same pixels, same dtype</text>
<line x1="564" y1="104" x2="644" y2="128" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="564" y1="188" x2="644" y2="156" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="970" y="86" width="190" height="112" rx="10" fill="#dafbe1" stroke="#2da44e" stroke-width="2"/>
<text x="1065.0" y="114" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2328">Agreement</text>
<text x="1065" y="148" text-anchor="middle" font-size="26" font-weight="800" fill="#1a7f37">≤ 1e-12</text>
<text x="1065" y="174" text-anchor="middle" font-size="12" fill="#57606a">round-off level</text>
<line x1="884" y1="142.0" x2="964" y2="142.0" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/>
<text x="40" y="266" font-size="12" fill="#57606a">Faithful to MATLAB details that ports usually get wrong: conv2 'same' centring, uint8 saturation in MI, edge() thinning, imgradientxy borders, left-to-right summation.</text>
</svg>